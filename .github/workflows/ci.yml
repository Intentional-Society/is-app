name: CI

on:
  pull_request:
    branches: [main]

# Minimum GITHUB_TOKEN scope the job actually needs.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: Lint & Functional Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7

      # Detect whether any non-docs files changed. Docs-only PRs skip
      # every subsequent step but the job still reports success, which
      # satisfies the branch-protection required check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `every`: a file counts toward `code` only if it matches all
          # four patterns (AND). Without this, paths-filter ORs them and
          # every file matches `**`, so `code` is always true.
          predicate-quantifier: "every"
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!AGENTS.md'
              - '!CLAUDE.md'

      - if: steps.filter.outputs.code == 'false'
        run: echo "Docs-only PR — lint and functional tests skipped."

      - uses: actions/setup-node@v7.1.0
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: 26
          cache: npm

      # The `supabase` devDependency is the same native binary that
      # supabase/setup-cli would download. Running it via npm keeps the CLI
      # version locked in package-lock.json (and tracked by Dependabot)
      # rather than floating behind `version: latest`, and removes one
      # third-party Action from the supply chain.
      - if: steps.filter.outputs.code == 'true'
        run: npm install

      # This reservation exists because the stack's default host ports sit in
      # the OS ephemeral range (Windows has the same hazard; see
      # docs/setup-dev-machine.md).
      #
      # `supabase start` binds a fixed span of host ports, 54321-54327. On
      # Linux they sit inside the ephemeral range (32768-60999), so an
      # outbound connection, such as the burst of parallel image pulls just
      # before the bind, can be handed one as its source port and make the
      # bind fail with "address already in use". Reserving the span keeps the
      # kernel from handing it out; explicit binds still succeed. The span
      # mirrors the host-bound ports in supabase/config.toml and
      # SUPABASE_API_PORT / SUPABASE_BLOCK_SIZE in scripts/setup.mjs; change
      # all three together (a newly host-bound port, such as the pooler, goes
      # in here too).
      # Append to the current list rather than replace it, in case the runner
      # image ships its own reservations.
      - if: steps.filter.outputs.code == 'true'
        run: |
          current="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${current:+$current,}54321-54327"
      - if: steps.filter.outputs.code == 'true'
        id: supabase
        run: npx supabase start
      # If the bind still fails, show what holds the ports. The runner is gone
      # by the time anyone reads the failure, so this is the only evidence.
      # This runs after the CLI has rolled back, so a short-lived socket may
      # already be closed: a socket listed here is a lasting holder, and empty
      # output points to a transient one (or to a cause other than the ports).
      # sudo: `ss -p` leaves root-owned sockets (docker-proxy, dockerd) blank.
      - if: failure() && steps.supabase.outcome == 'failure'
        run: |
          sysctl net.ipv4.ip_local_port_range net.ipv4.ip_local_reserved_ports
          sudo ss -tanp | grep -E ':5432[1-7]\b' || true

      # `biome ci` == `biome check` plus CI-flavored output (GitHub
      # annotations, no interactive prompts). Same coverage as
      # `npm run lint` locally; richer signal in PR checks.
      - if: steps.filter.outputs.code == 'true'
        run: npx biome ci .

      - if: steps.filter.outputs.code == 'true'
        run: npm run typecheck

      - if: steps.filter.outputs.code == 'true'
        run: node scripts/migrate.mjs

      # check-env (first step of dev:db) requires .env.local. CI's
      # DATABASE_URL env var above still wins over the file value
      # because process.env beats dotenv-loaded values.
      - if: steps.filter.outputs.code == 'true'
        run: cp .env.local.example .env.local

      - if: steps.filter.outputs.code == 'true'
        run: npm run test:functional
